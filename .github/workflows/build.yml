name: build

on:
  # branches run through their pull request and the merge queue
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number ||  github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@1b98c2449179262452af40bbbb35951b401058e0 # v5.3.0
        with:
          save-cache: true

  lint:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@1b98c2449179262452af40bbbb35951b401058e0 # v5.3.0

      - name: lint
        run: |
          pnpm oxlint --format github
          pnpm oxfmt
          pnpm lint:types

      - name: Check workflow files
        uses: docker://ghcr.io/jdx/jactionlint:2.2.0@sha256:71191bcf2428450553b54ac084c2b1be5594226b48211c3baf27a9a53955b9e3
        with:
          args: --color

  test:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@1b98c2449179262452af40bbbb35951b401058e0 # v5.3.0

      - name: test
        run: pnpm test
