name: build

on:
  # branches run through their pull request and the merge queue
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number ||  github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@b3992193bd288ca0549634a14e2f92969b2495e6 # v5.3.4
        with:
          save-cache: true

  lint:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@b3992193bd288ca0549634a14e2f92969b2495e6 # v5.3.4

      - name: lint
        run: |
          pnpm oxlint --format github
          pnpm oxfmt
          pnpm lint:types

      - name: Check workflow files
        uses: docker://ghcr.io/jdx/jactionlint:1.8.2@sha256:5515b269082f92ee0962ccc236df3300113aedcd4008a2aad5ad0903680b7c67
        with:
          args: --color

  test:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@b3992193bd288ca0549634a14e2f92969b2495e6 # v5.3.4

      - name: test
        run: pnpm test
