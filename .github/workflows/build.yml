name: build

on:
  # branches run through their pull request and the merge queue
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number ||  github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@24d505d494763b38cc2c3a4024f399055d741490 # v5.3.11
        with:
          save-cache: true

  lint:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@24d505d494763b38cc2c3a4024f399055d741490 # v5.3.11

      - name: lint
        run: |
          pnpm oxlint --format github
          pnpm oxfmt
          pnpm lint:types

      - name: Install the workflow linters
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs:
      - setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@24d505d494763b38cc2c3a4024f399055d741490 # v5.3.11

      - name: test
        run: pnpm test
