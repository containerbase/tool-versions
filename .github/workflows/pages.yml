name: pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every version again, without the previously published files
        type: boolean
        default: false
      budget:
        description: Download budget in whole GiB instead of the default 3 GiB, to compute many checksums at once
        type: string
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # a raised download budget takes longer
    timeout-minutes: ${{ inputs.budget && 120 || 30 }}

    outputs:
      changed: ${{ steps.pack.outputs.changed }}
      version: ${{ steps.pack.outputs.version }}
      breaking: ${{ steps.pack.outputs.breaking }}
      error: ${{ steps.pack.outputs.error }}

    steps:
      # the full commit history without the old file contents, which is enough
      # for the subjects of the commits since the previous release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          show-progress: false

      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@94c0237c419bc438ef4afaababec393bd4ee11e1 # v5.3.8
        with:
          checkout: false

      # the latest release is where the build and the release notes start from:
      # its archive is verified and extracted, `dir` is empty without a release
      - name: get the previous release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          gh release list --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags.txt"
          latest="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            previous="$RUNNER_TEMP/previous"
            mkdir -p "$previous/download" "$previous/files"
            gh release download "$latest" --pattern 'tool-versions-*.tar.xz*' --dir "$previous/download"
            (
              cd "$previous/download"
              for archive in tool-versions-*.tar.xz; do
                echo "$(cat "$archive.sha512")  $archive" | sha512sum --check --strict -
                tar -xJf "$archive" -C "$previous/files"
              done
            )
            git log --format=%s "$latest..HEAD" > "$RUNNER_TEMP/commits.txt"
            echo "dir=$previous/files" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # a failing tool falls back to its previous data with a warning, the
      # build only fails when a tool has neither fresh nor previous versions
      - name: build
        shell: bash
        run: |
          args=()
          if [ -n "$PREVIOUS_ARCHIVE" ]; then
            args+=(--previous-archive "$PREVIOUS_ARCHIVE")
          fi
          if [ -n "$BUDGET" ]; then
            export TOOL_VERSIONS_DOWNLOAD_BUDGET="$((BUDGET * 1024 ** 3))"
          fi
          pnpm build ${{ inputs.full && '--full' || '' }} "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_ARCHIVE: ${{ steps.previous.outputs.dir }}
          BUDGET: ${{ inputs.budget }}

      # packs the release archive and decides whether a release is due, which
      # the release job creates once the site is deployed: a push only releases
      # for a feature, a fix or a breaking change, data changes wait for the
      # daily build
      - name: pack the release archive
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT_NAME" = push ]; then
            args+=(--release-on code)
          fi
          while read -r tag; do
            args+=(--published "$tag")
          done < "$RUNNER_TEMP/tags.txt"
          if [ -n "$PREVIOUS_ARCHIVE" ]; then
            args+=(--previous "$PREVIOUS_ARCHIVE" --commits "$RUNNER_TEMP/commits.txt")
          fi
          pnpm pack:release "${args[@]}" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_ARCHIVE: ${{ steps.previous.outputs.dir }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pack.outputs.changed == 'true'
        with:
          name: release
          path: dist-release
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # a release is only created for what is deployed to the site
  release:
    needs:
      - build
      - deploy
    if: >
      github.ref == 'refs/heads/main' &&
      (needs.build.outputs.changed == 'true' || needs.build.outputs.breaking == 'true')
    runs-on: ubuntu-slim
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # a breaking change needs a new format folder, until then there is no
      # release, but the site is deployed as usual
      - name: fail for a breaking change
        if: needs.build.outputs.breaking == 'true'
        run: |
          echo "::error::$ERROR"
          echo "$ERROR" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        env:
          ERROR: ${{ needs.build.outputs.error }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: create the release
        run: >
          gh release create "v$VERSION"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "v$VERSION"
          --notes-file release-notes.md
          tool-versions-*.tar.xz
          tool-versions-*.tar.xz.sha512
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
