# https://pnpm.io/settings
saveExact: true
savePrefix: ''
shellEmulator: true
strictPeerDependencies: true

# renovate's optional native and postinstall builds aren't needed for its versionings
allowBuilds:
  core-js-pure: false
  protobufjs: false
  re2: false

overrides:
  dtrace-provider: '-'

# our own and renovate's packages are used right after their release, like in the renovate config
minimumReleaseAgeExclude:
  - '@containerbase/base'
  - '@containerbase/oxlint-plugin'
  - '@renovatebot/*'
  - renovate
